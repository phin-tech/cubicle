name: Cubicle
options:
  bundleIdPrefix: tech.phin
  # Matches the Xcode in use, so it does not offer to "update to recommended settings" on every regenerate.
  xcodeVersion: "27.2"
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    # The release version (`just release` tags v<this>); bump both for each release.
    # Starts at 0.0.0 so the first `just ship minor` releases 0.1.0.
    MARKETING_VERSION: "0.3.0-beta.1"
    CURRENT_PROJECT_VERSION: "9"
    # Package.swift is tools-version 5.9, so the code is Swift 5 language mode.
    SWIFT_VERSION: "5.0"
packages:
  # In-place updates (Sources/InstantSpaceSwitcher/Core/UpdateChecker.swift). app-release pins the same version.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  # Package.swift: the C event-tap core (ISS) and the socket layer shared with the CLI (CubicleIPC).
  Cubicle:
    path: .
targets:
  Cubicle:
    type: application
    platform: macOS
    sources:
      - path: Sources/InstantSpaceSwitcher
      - path: Resources
        buildPhase: resources
    # A shared scheme, generated every time: without one, Xcode can remember a scheme that a regenerate
    # removed and then show no way to build or archive the app.
    scheme: {}
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - package: Cubicle
        product: ISS
      - package: Cubicle
        product: CubicleIPC
      - package: Sparkle
      # The `cubicle` command. It lives in Contents/Helpers (not MacOS): on a case-insensitive disk,
      # `cubicle` and the app's own `Cubicle` executable would be the same file.
      - target: CubicleCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    # The Alfred workflow (alfred/), zipped into the app so the walkthrough can offer to add it. This runs after the
    # resources are copied and before the bundle is signed, so the signature covers it. Keep inputFiles in step with
    # the files in alfred/.
    postBuildScripts:
      - name: Bundle the Alfred workflow
        inputFiles:
          - $(SRCROOT)/alfred/info.plist
          - $(SRCROOT)/alfred/icon.png
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Cubicle.alfredworkflow
        script: |
          set -euo pipefail
          out="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Cubicle.alfredworkflow"
          rm -f "$out"
          cd "$SRCROOT/alfred"
          /usr/bin/zip -qrX "$out" info.plist icon.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.phin.Cubicle
        PRODUCT_NAME: Cubicle
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cubicle
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: AppIcon
        # A menu bar app: no Dock icon.
        LSUIElement: true
        NSHumanReadableCopyright: Copyright © 2026 jurplel
        # Sparkle: the appcast is an asset of the newest GitHub release (`just appcast` uploads it), and updates
        # must be signed by the private key in the Mac App Release 1Password item (sparkle_private_key).
        SUFeedURL: https://github.com/phin-tech/cubicle/releases/latest/download/appcast.xml
        SUPublicEDKey: 2mirghhdXOaz0RtSlgkR5MOzQxF+QkubzK9tgq8eO8U=
        SUEnableAutomaticChecks: true
  CubicleCLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/CubicleCLI
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - package: Cubicle
        product: CubicleIPC
    settings:
      base:
        PRODUCT_NAME: cubicle
        PRODUCT_BUNDLE_IDENTIFIER: tech.phin.Cubicle.cli
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
