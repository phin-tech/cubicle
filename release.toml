# What app-release (`just ship` and friends) knows about Cubicle. Every key: src/app_release/config.py
# in https://git.phin.tech/sam/app-release. Top-level keys go before the tables.
app = "Cubicle"
bundle_id = "tech.phin.Cubicle"
repo = "phin-tech/cubicle"
description = "Instant, named, searchable Spaces for macOS"
team_id = "J35P7AJDN7"
op_item = "op://Development/lc6wrq7lltjd47uue26cdxttzu"

[homebrew]
tap = "phin-tech/homebrew-tap"
token = "cubicle"
macos = "ventura"
# `brew install --cask cubicle` also puts the command-line tool on the PATH.
binary = { path = "Contents/Helpers/cubicle", name = "cubicle" }

# On the download page: the phin-apps bucket on Cloudflare R2, through the cf CLI (`cf auth login`). Under the name it
# shows the description above. allow = ["someone@gmail.com"] keeps it to those people, after signing in (Cloudflare
# Access); pin = true lists it first.
[downloads]

# `just notes patch` drafts release notes with a cheap model on OpenRouter. Its key is openrouter_api_key in the secrets
# store unless this says otherwise (another field, or an op:// reference to any item); OPENROUTER_API_KEY overrides both.
# [notes]
# api_key = "op://Private/OpenRouter API Key/credential"
